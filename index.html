<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>lab</title>
<style>
  :root {
    --bg: #f5f5f6; --card: #ffffff; --text: #171717; --muted: #6b7280;
    --line: #e5e5e5; --accent: #4f46e5; --code: #f1f1f3; --ok: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --card: #171717; --text: #ededed; --muted: #a3a3a3;
      --line: #2a2a2a; --accent: #a5b4fc; --code: #0f0f10; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .back { display: inline-block; padding: 6px 0; font-size: 14px; }

  /* lock screen */
  .lock { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  .lock input, .lock button {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px; margin-top: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .lock button { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 600; }
  .lock button:disabled { opacity: .6; }
  .err { color: #dc2626; font-size: 13px; min-height: 1.4em; }

  /* goal card */
  .goal {
    color: #fff; border-radius: 16px; padding: 18px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #c026d3);
    box-shadow: 0 8px 24px rgba(79, 70, 229, .25);
  }
  .goal a { color: rgba(255, 255, 255, .7); }
  .goal a b { color: #fff; font-weight: 600; }
  .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; color: rgba(255, 255, 255, .7); }
  .goal-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  .goal-title { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .goal-sub { font-size: 13px; color: rgba(255, 255, 255, .8); margin-top: 4px; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  .big span { font-size: 19px; color: rgba(255, 255, 255, .6); }
  .small { font-size: 12px; color: rgba(255, 255, 255, .7); }
  .bar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6ee7b7, #bef264, #fde047); }
  .bar.thin { height: 8px; margin-top: 6px; }
  .bar.thin i { background: linear-gradient(90deg, #7dd3fc, #a5f3fc); }
  .bar.plain { background: var(--line); height: 6px; margin-top: 8px; }
  .bar.plain i { background: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .chips .unit { text-transform: none; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 16px; }
  .row .mono { font-size: 14px; }
  .row .mono span { color: rgba(255, 255, 255, .6); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .stat, .list, .items { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .stat { padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }

  .list, .items { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .list li + li, .items li + li { border-top: 1px solid var(--line); }
  .list a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; color: inherit; }
  .list strong { display: block; font-weight: 600; }
  .chev { color: var(--muted); font-size: 20px; }

  .items summary, .items .line { display: flex; align-items: baseline; gap: 8px; padding: 11px 14px; cursor: pointer; list-style: none; color: inherit; }
  .items summary::-webkit-details-marker { display: none; }
  .tick { width: 1.1em; flex: none; color: var(--muted); }
  .done .tick { color: var(--ok); }
  .done .t { color: var(--muted); text-decoration: line-through; }
  .day { flex: none; width: 3.6em; font-size: 12px; color: var(--muted); }
  .t { flex: 1; min-width: 0; }
  .kind { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .detail { padding: 0 14px 12px 3.2em; font-size: 13.5px; }
  .detail p { margin: 0 0 8px; }
  .detail a { margin-right: 12px; }
  .btn { display: inline-block; border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 13px; }

  footer { margin-top: 28px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
  footer button { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }

  /* a note */
  .md { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 16px; margin-top: 10px; overflow-wrap: break-word; }
  .md h1 { font-size: 21px; margin: 16px 0 8px; }
  .md h2 { font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 26px 0 8px; }
  .md h3 { font-size: 15px; margin: 20px 0 6px; }
  .md p, .md ul, .md ol { margin: 0 0 10px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; background: var(--code); border-radius: 4px; padding: 1px 4px; }
  .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
  .md pre code { background: none; padding: 0; font-size: inherit; }
  .md blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .md .scroll { overflow-x: auto; margin: 10px 0; }
  .md table { border-collapse: collapse; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--code); }
  .diagram { overflow-x: auto; margin: 12px 0; }
  .diagram svg { display: block; margin: 0 auto; }
</style>
</head>

<script type="module">
import { gcm } from "./vendor/noble-ciphers/aes.js";
import { pbkdf2Async } from "./vendor/noble-hashes/pbkdf2.js";
import { sha256 } from "./vendor/noble-hashes/sha2.js";

(() => {
  const KEY_SLOT = "lab-status.key";
  const app = document.getElementById("app");
  const payload = JSON.parse(document.getElementById("payload").textContent);
  let data = null;

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const hours = (minutes) => String(Math.round(minutes / 6) / 10);
  const percent = (part, whole) => (whole ? Math.min(100, Math.round((part / whole) * 100)) : 0);
  const sum = (ns) => ns.reduce((a, n) => a + n, 0);

  // The data is AES-GCM encrypted under a PBKDF2 key (see app/static_export.py).
  // Decryption runs in plain JavaScript because Web Crypto is not available on
  // a page served over http. A wrong key fails the GCM check, so decrypt() throws.
  const deriveKey = (password) =>
    pbkdf2Async(sha256, new TextEncoder().encode(password), bytes(payload.salt), { c: payload.iter, dkLen: 32 });
  const decrypt = (key) =>
    JSON.parse(new TextDecoder().decode(gcm(key, bytes(payload.iv)).decrypt(bytes(payload.ct))));

  // The derived key (not the password) is kept on this device, so the password
  // is typed once and later visits skip the slow key derivation.
  const remembered = () => { try { return localStorage.getItem(KEY_SLOT); } catch { return null; } };
  const remember = (key) => { try { localStorage.setItem(KEY_SLOT, btoa(String.fromCharCode(...key))); } catch {} };
  const forget = () => { try { localStorage.removeItem(KEY_SLOT); } catch {} };

  function showLock(message = "") {
    data = null;
    app.innerHTML = `
      <form class="lock">
        <h1>lab</h1>
        <p class="muted">Enter the password to open this page.</p>
        <input type="password" autocomplete="current-password" aria-label="Password" autofocus>
        <button>Open</button>
        <p class="err" role="alert">${esc(message)}</p>
      </form>`;
    const form = app.querySelector("form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = form.querySelector("input").value;
      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "Opening…";
      if (!unlockWith(await deriveKey(password))) showLock("Wrong password.");
    });
  }

  function unlockWith(key) {
    try {
      data = decrypt(key);
    } catch {
      return false;
    }
    remember(key);
    render();
    return true;
  }

  const sheetTracks = () => data.tracks.filter((t) => t.key !== "dsa");
  const trackHref = (t) => (t.key === "dsa" ? "#/dsa" : `#/sheet/${t.key}`);

  function goalCard() {
    const solved = sum(data.tracks.map((t) => t.solved));
    const target = sum(data.tracks.map((t) => t.total));
    const minutes = sum(sheetTracks().map((t) => t.minutes));
    const minutesTotal = sum(sheetTracks().map((t) => t.minutes_total));
    const p = percent(solved, target);
    return `
      <section class="goal">
        <div class="goal-top">
          <div>
            <div class="eyebrow">Target</div>
            <div class="goal-title">${esc(data.title)}</div>
            ${data.subtitle ? `<div class="goal-sub">${esc(data.subtitle)}</div>` : ""}
          </div>
          <div>
            <div class="eyebrow">Problems solved</div>
            <div class="big mono">${solved}<span> / ${target}</span></div>
            <div class="small">${Math.max(0, target - solved)} to go · ${p}%</div>
          </div>
        </div>
        <div class="bar"><i style="width:${p}%"></i></div>
        <div class="chips mono">
          ${data.tracks.map((t) => `<a href="${trackHref(t)}">${esc(t.label)} <b>${t.solved}</b> / ${t.total}</a>`).join("")}
        </div>
        <div class="row">
          <div class="eyebrow">Concept hours</div>
          <div class="mono">≈ ${hours(minutes)}<span> / ${hours(minutesTotal)} h</span></div>
        </div>
        <div class="bar thin"><i style="width:${percent(minutes, minutesTotal)}%"></i></div>
        <div class="chips mono">
          ${sheetTracks().map((t) => `<a href="${trackHref(t)}">${esc(t.label)} <b>${hours(t.minutes)}</b> / ${hours(t.minutes_total)} <span class="unit">h</span></a>`).join("")}
        </div>
      </section>`;
  }

  function home() {
    const dsa = data.tracks.find((t) => t.key === "dsa");
    const sheetRows = data.sheets.map((sheet) => {
      const t = data.tracks.find((x) => x.key === sheet.key);
      const next = sheet.phases.flatMap((ph) => ph.items).find((it) => !it.done_on);
      return `<li><a href="#/sheet/${esc(sheet.key)}"><div><strong>${esc(sheet.name)}</strong>
        <span class="muted">${t.days_done} of ${t.days_total} days${next ? ` · next: ${esc(next.title)}` : " · all done"}</span></div><span class="chev">›</span></a></li>`;
    });
    const noteRows = data.notes.map((n) => `<li><a href="#/note/${esc(n.track)}/${esc(n.id)}"><div><strong>${esc(n.title)}</strong>
      <span class="muted">${esc(n.track_label)}${n.day ? ` · Day ${n.day}` : ""} · ${n.minutes_read} min read</span></div><span class="chev">›</span></a></li>`);
    const updated = new Date(data.generated_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    return `
      ${goalCard()}
      <section class="stats">
        <div class="stat"><b>${data.streak_days}</b><span class="muted">day streak</span></div>
        <div class="stat"><b>${esc(data.last_active ?? "—")}</b><span class="muted">last active</span></div>
      </section>
      <h2>Tracks</h2>
      <ul class="list">
        <li><a href="#/dsa"><div><strong>DSA</strong>
          <span class="muted">${dsa.solved} of ${dsa.total} solved · ${data.problems.length} on your list</span></div><span class="chev">›</span></a></li>
        ${sheetRows.join("")}
      </ul>
      <h2>Notes</h2>
      ${noteRows.length ? `<ul class="list">${noteRows.join("")}</ul>` : `<p class="muted">No notes yet.</p>`}
      <footer><span>Snapshot from ${esc(updated)}</span><button type="button" id="forget">Lock this device</button></footer>`;
  }

  function sheetView(key) {
    const sheet = data.sheets.find((s) => s.key === key);
    if (!sheet) return null;
    const t = data.tracks.find((x) => x.key === key);
    const noted = new Set(data.notes.filter((n) => n.track === key).map((n) => n.id));
    const phases = sheet.phases.map((ph) => `
      <h2>${esc(ph.title)} · ${ph.items.filter((it) => it.done_on).length}/${ph.items.length}</h2>
      <ul class="items">${ph.items.map((it) => `
        <li class="${it.done_on ? "done" : ""}"><details>
          <summary><span class="tick">${it.done_on ? "✓" : "○"}</span><span class="day mono">Day ${it.day}</span><span class="t">${esc(it.title)}</span><span class="kind">${esc(it.kind)}</span></summary>
          <div class="detail">
            ${it.task ? `<p>${esc(it.task)}</p>` : ""}
            <p class="muted">${it.minutes ? `about ${it.minutes} min` : ""}${it.done_on ? ` · done on ${esc(it.done_on)}` : ""}</p>
            <p>${it.resources.map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)} ↗</a>`).join("")}</p>
            ${noted.has(it.id) ? `<a class="btn" href="#/note/${esc(key)}/${esc(it.id)}">Read note</a>` : ""}
          </div>
        </details></li>`).join("")}
      </ul>`);
    return `
      <a class="back" href="#/">‹ Home</a>
      <h1>${esc(sheet.name)}</h1>
      <div class="muted">${t.days_done} of ${t.days_total} days done · ${t.solved} of ${t.total} design problems</div>
      <div class="bar plain"><i style="width:${percent(t.days_done, t.days_total)}%"></i></div>
      ${phases.join("")}`;
  }

  function dsaView() {
    const dsa = data.tracks.find((t) => t.key === "dsa");
    const rows = [...data.problems]
      .sort((a, b) => (b.status === "solved") - (a.status === "solved") || String(a.due ?? "").localeCompare(String(b.due ?? "")))
      .map((p) => {
        const solved = p.status === "solved";
        const when = solved ? (p.solved_on ? `solved ${p.solved_on}` : "solved") : p.due ? `due ${p.due}` : "";
        return `<li class="${solved ? "done" : ""}"><a class="line" href="https://leetcode.com/problems/${esc(p.slug)}/" target="_blank" rel="noopener noreferrer">
          <span class="tick">${solved ? "✓" : "○"}</span><span class="day mono">${p.leetcode_id}</span><span class="t">${esc(p.name)}<br><span class="muted">${esc(when)}</span></span></a></li>`;
      });
    return `
      <a class="back" href="#/">‹ Home</a>
      <h1>DSA</h1>
      <div class="muted">${dsa.solved} of ${dsa.total} solved</div>
      <div class="bar plain"><i style="width:${percent(dsa.solved, dsa.total)}%"></i></div>
      <h2>Your list</h2>
      ${rows.length ? `<ul class="items">${rows.join("")}</ul>` : `<p class="muted">No problems assigned yet.</p>`}`;
  }

  function noteView(track, id) {
    const note = data.notes.find((n) => n.track === track && n.id === id);
    if (!note) return null;
    const back = track === "dsa" ? "" : ` · <a href="#/sheet/${esc(track)}">${esc(note.track_label)} sheet</a>`;
    // note.html was rendered from markdown at build time with raw HTML escaped.
    return `
      <a class="back" href="#/">‹ Home</a>
      <div class="muted">${esc(note.track_label)}${note.day ? ` · Day ${note.day}` : ""} · ${note.minutes_read} min read${back}</div>
      <article class="md">${note.html}</article>`;
  }

  let mermaidLoading = null;
  function loadMermaid() {
    mermaidLoading ??= new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "mermaid.min.js";
      script.onload = () => {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral",
          sequence: { width: 120, actorMargin: 30 },
        });
        resolve(window.mermaid);
      };
      script.onerror = reject;
      document.head.append(script);
    });
    return mermaidLoading;
  }

  // Replace each ```mermaid block with its diagram. On failure the source stays.
  async function drawDiagrams(root) {
    const blocks = [...root.querySelectorAll("pre > code.language-mermaid")];
    if (!blocks.length) return;
    let mermaid;
    try { mermaid = await loadMermaid(); } catch { return; }
    for (const [i, code] of blocks.entries()) {
      const source = code.textContent;
      try {
        if (!(await mermaid.parse(source, { suppressErrors: true }))) continue;
        const { svg } = await mermaid.render(`diagram-${Date.now()}-${i}`, source);
        const box = document.createElement("div");
        box.className = "diagram";
        box.innerHTML = svg;
        code.parentElement.replaceWith(box);
        // A wide diagram scrolls sideways instead of shrinking until it is unreadable.
        const drawn = box.querySelector("svg");
        const natural = drawn.viewBox.baseVal.width;
        if (natural > box.clientWidth) {
          drawn.style.maxWidth = "none";
          drawn.style.width = `${Math.round(Math.max(box.clientWidth, natural * 0.8))}px`;
        }
      } catch {}
    }
  }

  function render() {
    if (!data) return;
    const [, view, a, b] = (location.hash.slice(1) || "/").split("/");
    const html =
      view === "sheet" ? sheetView(a) : view === "dsa" ? dsaView() : view === "note" ? noteView(a, b) : home();
    app.innerHTML = html ?? home();
    window.scrollTo(0, 0);
    document.getElementById("forget")?.addEventListener("click", () => { forget(); showLock(); });
    const article = app.querySelector(".md");
    if (article) {
      for (const link of article.querySelectorAll("a[href^='http']")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
      for (const table of article.querySelectorAll("table")) {
        const wrap = document.createElement("div");
        wrap.className = "scroll";
        table.replaceWith(wrap);
        wrap.append(table);
      }
      drawDiagrams(article);
    }
  }

  window.addEventListener("hashchange", render);
  const saved = remembered();
  if (!saved || !unlockWith(bytes(saved))) showLock();
})();
</script>
</body>
</html>
